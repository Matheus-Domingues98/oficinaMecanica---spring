# ================================================
# PROFILE: dev — MySQL (mecanica_IFSP)
# ================================================
# Para ativar: altere application.properties para
#   spring.profiles.active=dev

# DATASOURCE
spring.datasource.url=jdbc:mysql://localhost:3306/mecanica_IFSP?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MAIL — Gmail SMTP
# Configure as variáveis de ambiente MAIL_USERNAME e MAIL_PASSWORD
# No Gmail: Conta > Segurança > Senhas de app (requer 2FA ativado)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:seu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua-senha-de-app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8